  <circle cx="140" cy="420" r="7" fill="#45B7D1" opacity="0.7"/>
  <circle cx="370" cy="430" r="9" fill="#96CEB4" opacity="0.7"/>
  <circle cx="70" cy="280" r="6" fill="#FFEAA7" opacity="0.6"/>
  <circle cx="440" cy="260" r="7" fill="#DDA0DD" opacity="0.6"/>
